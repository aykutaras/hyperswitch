<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to {entity_name}</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {{
        margin: 0;
        padding: 0;
        background-color: #f6f6f8;
        font-family: "Inter", Arial, sans-serif;
      }}
      p {{
        margin-bottom: 20px;
        font-size: 16px;
        line-height: 1.5;
      }}
    </style>
  </head>
  <body>
    <div
      style="
        max-width: 600px;
        margin: auto;
        padding: 20px;
        background-color: {background_color};
        color: {foreground_color};
      "
    >
      <img
        src="{entity_logo_url}"
        alt="{entity_name}"
        style="height: auto; width: 4rem"
      />
      <hr style="border: none; border-top: 2px solid {primary_color}" />
      <p>Hello there,</p>
      <p>
        Thank you for signing up on the {entity_name} Dashboard. We're glad to
        have you with us.
      </p>
      <p>Thank you,<br />Team {entity_name}</p>
    </div>
  </body>
</html>
